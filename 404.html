<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galo mudou-se</title>
    <script>
      // The old link may carry a room name: #/?room=<name>. It moves with the visitor.
      ;(function () {
        var match = /[?&]room=([^&]*)/.exec(location.hash)
        var target = 'https://6135.github.io/games/#/?game=galo' + (match ? '&room=' + match[1] : '')
        location.replace(target)
      })()
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://6135.github.io/games/#/?game=galo" />
    </noscript>
  </head>
  <body>
    <p>
      O jogo Galo mudou-se para
      <a href="https://6135.github.io/games/#/?game=galo">6135.github.io/games</a>.
    </p>
  </body>
</html>
